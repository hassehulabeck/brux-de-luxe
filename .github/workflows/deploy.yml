name: Deploy

# Builds the table app and uploads it to the web hotel over FTP on every push
# to main. Needs these repository secrets (Settings → Secrets → Actions):
# FTP_SERVER, FTP_USERNAME, FTP_PASSWORD and FTP_SERVER_DIR (ending in "/").
# Until they are set, the workflow builds and skips the upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @brux/web build

      - name: Upload to the web hotel
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: apps/web/dist/

      - name: No FTP secrets yet
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP secrets are not set, so the build was not uploaded."
